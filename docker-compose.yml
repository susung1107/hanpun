# 한푼 — 로컬 개발용 데이터베이스 (MySQL 8)
# 사용: docker compose up -d   /   중지: docker compose down
services:
  mysql:
    image: mysql:8.4
    container_name: hanpun-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: hanpun_root_dev
      MYSQL_DATABASE: hanpun
      MYSQL_USER: hanpun
      MYSQL_PASSWORD: hanpun_dev
      TZ: UTC
    ports:
      - '3306:3306'
    volumes:
      - hanpun-mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p$$MYSQL_ROOT_PASSWORD']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  hanpun-mysql-data:
